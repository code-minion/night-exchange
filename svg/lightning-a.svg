<svg xmlns="http://www.w3.org/2000/svg" width="64" height="48" fill="none" class="nx-lightning nx-lightning-a" role="img" viewBox="0 0 64 48">
  <title>Approach spark A — tip to socket</title>
  <!--
    Local short arc. Place so path starts near tip and ends at socket center.
    Default endpoints in this viewBox: tip-ish (12, 40) -> socket (52, 10).
    Engineer may scale/rotate/stretch to actual tip→socket vector; keep stroke thin.
    Warm ivory core + amber edge. No fullscreen flash.
  -->
  <defs>
    <linearGradient id="nx-lz-a-edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ee9a40" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f3e6c4" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <!-- amber edge -->
  <path fill="none" stroke="url(#nx-lz-a-edge)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"
        d="M12 40 L22 28 L28 32 L38 16 L44 20 L52 10" opacity=".9"/>
  <!-- ivory core -->
  <path fill="none" stroke="#fff6e4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
        d="M12 40 L22 28 L28 32 L38 16 L44 20 L52 10" opacity=".95"/>
  <!-- tiny terminus dots -->
  <circle cx="12" cy="40" r="1.4" fill="#fff6e4" opacity=".85"/>
  <circle cx="52" cy="10" r="1.6" fill="#ee9a40" opacity=".75"/>
</svg>
