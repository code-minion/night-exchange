<svg xmlns="http://www.w3.org/2000/svg" width="88" height="156" fill="none" class="nx-plug" role="img" viewBox="0 0 88 156"><title>Switchboard plug head</title><style>.nx-plug.nx-is-pulse {
      --nx-pulse: 1;
