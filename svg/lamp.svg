<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" fill="none" class="nx-lamp" role="img" viewBox="0 0 180 180"><title>Amber lamp</title><style>.nx-lamp{--nx-lamp:0}.nx-lamp.nx-is-off{--nx-lamp: 0}.nx-lamp.nx-is-dim{--nx-lamp: 0.42}.nx-lamp.nx-is-bloom{--nx-lamp: 1}.nx-lamp-glow{opacity:var(--nx-lamp, 0);mix-blend-mode:screen}.nx-lamp-ripple{mix-blend-mode:screen}</style><defs><radialGradient id="nx-lamp-lens" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#fff6e8"/><stop offset=".38" stop-color="#ffd7a3"/><stop offset=".72" stop-color="#ee9a40"/><stop offset="1" stop-color="#c46a20"/></radialGradient><radialGradient id="nx-lamp-lens-dark" cx=".4" cy=".36" r=".72"><stop offset="0" stop-color="#8a5428"/><stop offset=".55" stop-color="#4a2c16"/><stop offset="1" stop-color="#24160f"/></radialGradient><radialGradient id="nx-lamp-halo" cx=".5" cy=".5" r=".5" color-interpolation="sRGB"><stop offset="0" stop-color="#ee9a40" stop-opacity=".62"/><stop offset=".4" stop-color="#ee9a40" stop-opacity=".34"/><stop offset=".72" stop-color="#ee9a40" stop-opacity=".1"/><stop offset="1" stop-color="#ee9a40" stop-opacity="0"/></radialGradient><radialGradient id="nx-lamp-spill" cx=".5" cy=".5" r=".5" color-interpolation="sRGB"><stop offset="0" stop-color="#ffb15a" stop-opacity=".9"/><stop offset=".45" stop-color="#ffb15a" stop-opacity=".5"/><stop offset=".78" stop-color="#ffb15a" stop-opacity=".16"/><stop offset="1" stop-color="#ffb15a" stop-opacity="0"/></radialGradient><radialGradient id="nx-lamp-mid" cx=".5" cy=".48" r=".5" color-interpolation="sRGB"><stop offset="0" stop-color="#ffd7a3" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd7a3" stop-opacity=".7"/><stop offset=".7" stop-color="#ffd7a3" stop-opacity=".22"/><stop offset="1" stop-color="#ffd7a3" stop-opacity="0"/></radialGradient><radialGradient id="nx-lamp-core" cx=".45" cy=".42" r=".55" color-interpolation="sRGB"><stop offset="0" stop-color="#fff1d4" stop-opacity="1"/><stop offset=".4" stop-color="#fff1d4" stop-opacity=".85"/><stop offset="1" stop-color="#fff1d4" stop-opacity="0"/></radialGradient><radialGradient id="nx-lamp-ripple-grad" cx=".5" cy=".5" r=".5" color-interpolation="sRGB"><stop offset="0" stop-color="#ee9a40" stop-opacity="0"/><stop offset=".58" stop-color="#ee9a40" stop-opacity="0"/><stop offset=".74" stop-color="#ee9a40" stop-opacity=".7"/><stop offset=".9" stop-color="#ee9a40" stop-opacity="0"/><stop offset="1" stop-color="#ee9a40" stop-opacity="0"/></radialGradient><linearGradient id="nx-lamp-bezel" x1=".2" x2=".85" y1="0" y2="1"><stop offset="0" stop-color="#e7d3a6"/><stop offset=".4" stop-color="#c9a45e"/><stop offset="1" stop-color="#6e5936"/></linearGradient></defs><g class="nx-lamp-glow"><circle cx="90" cy="90" r="84" fill="url(#nx-lamp-halo)"/><circle cx="90" cy="90" r="58" fill="url(#nx-lamp-spill)"/><circle cx="90" cy="90" r="36" fill="url(#nx-lamp-mid)"/></g><circle class="nx-lamp-ripple" cx="90" cy="90" r="78" fill="url(#nx-lamp-ripple-grad)" style="opacity:calc(var(--nx-lamp, 0)*(1 - var(--nx-lamp, 0))*2.6)"/><circle cx="90" cy="91.2" r="29" fill="#3a2e18"/><circle cx="90" cy="90" r="28" fill="url(#nx-lamp-bezel)"/><circle cx="90" cy="90" r="28" stroke="#4a3b22" stroke-width=".8"/><path stroke="#f3e6c4" stroke-linecap="round" stroke-width="2.2" d="M68 78a24 24 0 0 1 44 0" opacity=".55"/><circle cx="90" cy="90" r="21.5" stroke="#3a2e18" stroke-width="2.4"/><circle cx="90" cy="90" r="19" fill="url(#nx-lamp-lens)"/><circle cx="90" cy="90" r="19" fill="url(#nx-lamp-lens-dark)" style="opacity:calc((1 - var(--nx-lamp, 0))*(1 - var(--nx-lamp, 0)))"/><g class="nx-lamp-glow"><circle cx="90" cy="90" r="18" fill="url(#nx-lamp-core)"/><circle cx="90" cy="88" r="4.5" fill="#fffaf2" opacity=".95"/></g><ellipse cx="82" cy="82" fill="#fff8ee" opacity=".55" rx="6.5" ry="3.2" transform="rotate(-34 82 82)"/></svg>